services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_document_backend

    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    volumes:
      - ./data/faiss_index:/app/data/faiss_index

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_document_frontend

    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    env_file:
      - .env.docker

    ports:
      - "8503:8501"

    depends_on:
      - backend

    restart: unless-stopped